name: Plugin Version Validator
description: >-
  Fail the build when a plugin's source changed without a plugin.json version
  bump, or when plugin.json and marketplace.json versions drift out of sync.

inputs:
  repo-root:
    description: Repository root containing .claude-plugin/marketplace.json.
    required: false
    default: "."
  base-ref:
    description: >-
      Base ref to diff against for the source-change bump check. Leave empty to
      run the sync check only. In a pull_request workflow pass the base branch.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate plugin versions
      shell: bash
      env:
        REPO_ROOT: ${{ inputs.repo-root }}
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        set -euo pipefail
        BASE_ARG=""
        if [ -n "${BASE_REF}" ]; then
          git -C "${REPO_ROOT}" fetch --no-tags --depth=1 origin "${BASE_REF}" 2>/dev/null || true
          # Prefer the fetched remote ref; fall back to the bare ref.
          if git -C "${REPO_ROOT}" rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            BASE_ARG="--base-ref origin/${BASE_REF}"
          else
            BASE_ARG="--base-ref ${BASE_REF}"
          fi
        fi
        swift "${GITHUB_ACTION_PATH}/validate-versions.swift" --repo-root "${REPO_ROOT}" ${BASE_ARG}
